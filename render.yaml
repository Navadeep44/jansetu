services:
  - type: web
    name: jansetu
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/jansetu.db
      - key: HOUSEHOLD_SALT
        generateValue: true
      - key: AUTH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: LLM_PROVIDER
        value: none
      - key: ASR_PROVIDER
        value: none
